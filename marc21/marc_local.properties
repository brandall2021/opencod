# marc_local.properties sugerido para VuFind
# Ubicación sugerida: $VUFIND_LOCAL_DIR/import/marc_local.properties
# (o directamente $VUFIND_HOME/import/marc_local.properties si no hay directorio local)
#
# El id único ya viene en 001 (SNA00000XXX) y es el mapeo por defecto, no hace falta tocarlo.

# --- Facetas de ubicación, según la convención de ejemplares 952 generada ---
institution = 952b
building = 952c
collection = 9528

# --- Números de ejemplar ---
itembarcode_str = 952p
itemcallnumber_str = 952o
itemnotes_str = 952z
item_id_str = 952p

# --- Call numbers (090 ya está en el mapeo por defecto; complemento) ---
callnumber-raw = 099ab:090ab:050ab
callnumber-sort = custom, getLCSortable(099ab:090ab:050ab)
callnumber-first = 099a[0]:090a[0]:050a[0], callnumber_map.properties, first

# --- ISBN/ISSN (vinieron de los campos 010/011/015 de BIBUN) ---
isbn = 020a:773z
issn = 022a:440x:490x:730x:773x:776x:780x:785x

# --- Autoridad de materias con $9: evita indexar la sigla comme descripteur ---
# (Las 650 llevan $9 FCN-UNT; el mapeo por defecto usa 650a así que no requiere cambios.)
